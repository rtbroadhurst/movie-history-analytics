[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "movie-history-analytics"
version = "0.1.0"
description = "A movie watch history analytics dashboard"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
movie-analytics = "movie_history_analytics.main:main"

[tool.setuptools.packages.find]
where = ["src"]
